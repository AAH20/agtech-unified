apiVersion: apps/v1
kind: Deployment
metadata:
  name: agtech-unified
  labels:
    app: agtech-unified
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agtech-unified
  template:
    metadata:
      labels:
        app: agtech-unified
    spec:
      containers:
        - name: agtech-unified
          image: agtech-unified:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agtech-unified-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agtech-unified-secrets
                  key: jwt-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agtech-unified-secrets
                  key: database-url
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
