apiVersion: v1
kind: ConfigMap
metadata:
  name: agtech-unified-config
  labels:
    app: agtech-unified
data:
  AGTECH_ENV: "production"
  LOG_LEVEL: "INFO"
  API_PORT: "8000"
  MQTT_BROKER_URL: "mqtt-broker"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  TIMESCALEDB_URL: "timescaledb"
  GPU_ENABLED: "false"
  BATCH_SIZE: "32"
  MAX_WORKERS: "4"
  RATE_LIMIT_PER_MINUTE: "60"
