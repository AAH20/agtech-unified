apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agtech-unified
  labels:
    app: agtech-unified
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - agtech.example.com
      secretName: agtech-unified-tls
  rules:
    - host: agtech.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agtech-unified
                port:
                  number: 8000
