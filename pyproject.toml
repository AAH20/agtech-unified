[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agtech-unified"
version = "1.0.0"
description = "Unified Precision Agriculture & Genetic Engineering Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Hassan, Ahmed"}
]
keywords = ["agriculture", "agtech", "precision-agriculture", "genomics", "iot", "edge-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "fastapi==0.115.6",
    "pydantic==2.10.4",
    "PyJWT==2.10.1",
    "numpy==2.2.1",
    "torch==2.5.1",
    "requests==2.32.3",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "onnx==1.17.0",
    "hypothesis==6.168.3",
]
dev = [
    "ruff==0.8.4",
    "bandit==1.8.0",
    "pytest==8.3.4",
    "httpx==0.28.1",
    "onnx==1.17.0",
]

[project.urls]
Homepage = "https://github.com/AAH20/agtech-unified"
Repository = "https://github.com/AAH20/agtech-unified"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
