[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agtech-unified"
version = "1.0.0"
description = "Unified Precision Agriculture & Genetic Engineering Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Hassan, Ahmed"}
]
keywords = ["agriculture", "agtech", "precision-agriculture", "genomics", "iot", "edge-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "fastapi==0.142.2",
    "pydantic==2.10.4",
    "PyJWT==2.10.1",
    "numpy==2.2.1",
    "requests==2.32.3",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.6.1",
    "pytest-asyncio>=0.25.0",
    "attrs>=23.2.0",
    "rdflib>=7.0,<8",
    "tomli>=2.0; python_version < '3.11'",
    "httpx==0.28.1",
    "onnx==1.17.0",
    "hypothesis==6.168.3",
]
dev = [
    "ruff==0.8.4",
    "bandit==1.8.0",
    "pytest==8.3.4",
    "httpx==0.28.1",
    "onnx==1.17.0",
]
gpu = [
    "torch==2.14.1",
]

[project.urls]
Homepage = "https://github.com/AAH20/agtech-unified"
Repository = "https://github.com/AAH20/agtech-unified"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests for individual modules",
    "integration: Integration tests spanning multiple modules",
    "property: Property-based tests using hypothesis",
    "regression: Regression tests for known bugs and edge cases",
    "concurrency: Concurrency and thread-safety tests",
    "performance: Performance and benchmark tests",
    "reliability: Fault injection and recovery tests",
    "slow: Tests that take longer than 1 second",
    "gpu: Tests requiring torch/CUDA (auto-skipped when torch is absent)",
]
timeout = 300

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E741", "E402", "N803", "N806", "N815"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
